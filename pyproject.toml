[project]
name = "shellix"
version = "0.1.0"
description = "An AI-assisted shell interface"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
shellix = "shellix.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shellix"]

[tool.pytest.ini_options]
pythonpath = ["src"]
